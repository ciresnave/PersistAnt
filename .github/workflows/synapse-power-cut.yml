# SPDX-License-Identifier: MIT OR Apache-2.0
# Synapse's own power-loss test for its mailbox (board 229, the stop-line for removing redb): the same
# harness as machine-durability.yml (scripts/machine-durability/run.ps1), driven with Synapse's guest
# binary `mailbox_vm` instead of PersistAnt's `machine_vm`. It has the same command line, output and
# exit codes, so run.ps1 needs no change.
#
# Conditions of CIRESNAVE-EXPECTATIONS 5.1g/5.1h: workflow_dispatch only (no pull_request trigger, so no
# PR code reaches the runner), only from this repository's main branch, only for a Synapse commit that
# is on Synapse's main branch (proved below, not assumed), no secrets, never #[ignore]d. The Synapse
# repository is public, so no token is needed to read it. The binary is built on a hosted runner
# (gh-runner has no toolchain and no Docker) on Ubuntu 24.04, the guest's own glibc.
#
# Backends: `sqlite` only. run.ps1 adds the known-bad control (`sqlite-off`, 4 cycles) by itself, and a
# backend named in -Backends gets hold cycles and a disk-full check; naming `sqlite-off` there would make
# the control cycles "must hold" and send it to the PostgreSQL/MySQL volume.
name: synapse-power-cut
run-name: synapse-power-cut ${{ inputs.synapse_sha }}

on:
  workflow_dispatch:
    inputs:
      synapse_sha:
        description: 'Full 40-character commit of ThinkersJournal/synapse that is on its main branch'
        required: true
        type: string

permissions:
  contents: read

jobs:
  guest-binary:
    name: Build mailbox_vm (Ubuntu 24.04, hosted)
    runs-on: ubuntu-24.04
    steps:
      - name: Only this repository's main branch
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "this workflow runs only from main (got $REF)"
          exit 1
      - name: The input is a full commit hash
        env:
          SHA: ${{ inputs.synapse_sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "synapse_sha must be 40 lower-case hex characters"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ThinkersJournal/synapse
          ref: ${{ inputs.synapse_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: synapse
      - name: The commit is on Synapse's main branch
        working-directory: synapse
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "synapse $(git rev-parse HEAD) is an ancestor of origin/main $(git rev-parse origin/main)"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Build the guest binary
        working-directory: synapse
        run: cargo build --locked --release -p synapse-mailbox-persistant --example mailbox_vm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailbox_vm
          path: synapse/target/release/examples/mailbox_vm
          if-no-files-found: error

  power-loss:
    name: Power loss (Hyper-V guest, self-hosted)
    needs: guest-binary
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Only this repository's main branch
        if: github.ref != 'refs/heads/main'
        shell: powershell
        env:
          REF: ${{ github.ref }}
        run: |
          Write-Host "this workflow runs only from main (got $env:REF)"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mailbox_vm
          path: guest
      - name: Power-cut the guest, boot it, check every acknowledged message
        shell: powershell
        run: >
          ./scripts/machine-durability/run.ps1
          -Binary "$PWD\guest\mailbox_vm"
          -Backends sqlite
          -WorkDir "$env:RUNNER_TEMP\synapse-power-cut"
          -ResultFile "$env:RUNNER_TEMP\synapse-power-cut-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synapse-power-cut-result
          path: ${{ runner.temp }}/synapse-power-cut-result.json
          if-no-files-found: warn
