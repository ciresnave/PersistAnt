name: Fresh lock

# Every other job is `--locked`, so a dependency that moves under the committed lockfile (the bundled
# SQLite, 3.51.3 to 3.54.1 on 2026-11-19) is invisible to CI while a consumer on a fresh lockfile is
# refused at `open_named` ("unverified(no row)"). This job re-resolves the lock, so a moving
# dependency fails HERE, loudly, instead of in a consumer. It is deliberately NOT a required check
# and does not run on pull requests: a moving dependency must not turn `main` red.
#
# It also records the rows: the SQLite generator runs on all three operating systems against the
# fresh lock and, when a row set is new, a pull request adds it. (Needs the repository setting
# "Allow GitHub Actions to create and approve pull requests"; without it the last step fails and the
# rows are still in the artifacts of this run.)

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  certify:
    name: Fresh lock on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Re-resolve the lockfile (no --locked from here on)
        shell: bash
        run: |
          cargo update
          cargo tree --workspace --all-features -i libsqlite3-sys || true

      - name: Generate the SQLite rows of this operating system
        shell: bash
        run: |
          mkdir -p generated
          cargo run -q -p persistant-sqlx --features sqlite --example matrix_sqlite > generated/sqlx-sqlite.tsv

      - name: Upload what was generated
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-lock-sqlx-sqlite-${{ runner.os }}
          path: generated/sqlx-sqlite.tsv

      # The loud part: with the fresh lock, the registry must open sqlite and sqlite-full for the
      # key-value needs. It fails when no recorded row names the newest bundled SQLite.
      - name: open_named still opens on the fresh lock
        run: cargo test -p persistant --features registry-sqlite --test registry --test registry_listed_opens --no-fail-fast

      - name: The checked-in rows name the SQLite this lock builds
        shell: bash
        run: |
          ver=$(awk -F'\t' 'NR==2{print $4}' generated/sqlx-sqlite.tsv)
          echo "built: $ver"
          grep -qF "$ver" matrix/sqlx-sqlite.tsv || { echo "::error::no row in matrix/sqlx-sqlite.tsv for $ver"; exit 1; }

  rows-pr:
    name: Open a pull request with new rows
    needs: certify
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Collect the rows of the three operating systems
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fresh
          for os in Linux Windows macOS; do
            gh run download "${{ github.run_id }}" -n "fresh-lock-sqlx-sqlite-$os" -D "fresh/$os" || echo "no artifact for $os"
          done
          added=0
          for os in Linux Windows macOS; do
            f="fresh/$os/sqlx-sqlite.tsv"
            [ -f "$f" ] || continue
            tail -n +2 "$f" | grep -vxFf matrix/sqlx-sqlite.tsv > "fresh/new-$os.tsv" || true
            n=$(wc -l < "fresh/new-$os.tsv")
            echo "$os: $n new rows"
            if [ "$n" -gt 0 ]; then cat "fresh/new-$os.tsv" >> matrix/sqlx-sqlite.tsv; added=$((added + n)); fi
          done
          echo "added=$added" >> "$GITHUB_ENV"

      - name: Open or update the pull request
        if: env.added != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/fresh-lock-rows
          git add matrix/sqlx-sqlite.tsv
          git commit -m "matrix: SQLite rows recorded on a fresh lockfile ($added rows)"
          git push --force origin bot/fresh-lock-rows
          if [ -z "$(gh pr list --head bot/fresh-lock-rows --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head bot/fresh-lock-rows \
              --title "matrix: SQLite rows recorded on a fresh lockfile" \
              --body "Rows generated by the scheduled fresh-lock job (run ${{ github.run_id }}) on linux, windows and macos, appended to matrix/sqlx-sqlite.tsv. Update the row-count in tests/checked_in_matrix_sqlite.rs if it names a total. Needs a changelog fragment. — lane: persistant"
          fi
