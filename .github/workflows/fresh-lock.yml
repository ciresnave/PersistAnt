name: Fresh lock

# Every other job is `--locked`, so a dependency that moves under the committed lockfile (the bundled
# SQLite, 3.51.3 to 3.54.1 on 2026-11-19) is invisible to CI while a consumer on a fresh lockfile is
# refused at `open_named` ("unverified(no row)"). This job re-resolves the lock, so a moving
# dependency fails HERE, loudly, instead of in a consumer. It is deliberately NOT a required check
# and does not run on pull requests: a moving dependency must not turn `main` red.
#
# It also collects the rows: the SQLite generator runs on all three operating systems against the
# fresh lock, the rows not yet in matrix/sqlx-sqlite.tsv are uploaded as ONE artifact, and an issue
# is opened or updated saying so. A person (or the lane) commits them on a normal branch whose CI
# runs. It does not open a pull request: per GitHub's docs ("Triggering a workflow",
# docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow),
# events caused by the repository's GITHUB_TOKEN do not start new workflow runs (only
# workflow_dispatch and repository_dispatch do), and a pull request created with it gets runs held in
# an approval-required state at best; either way its required checks would not run by themselves.
# The issue needs only `issues: write`.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Two runs (a schedule and a dispatch) must not both open the tracking issue.
concurrency:
  group: fresh-lock
  cancel-in-progress: false

jobs:
  certify:
    name: Fresh lock on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A fresh lock runs build scripts of whatever `cargo update` resolved; they must not find
          # the checkout token in .git/config.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Re-resolve the lockfile (no --locked from here on)
        shell: bash
        run: |
          cargo update
          cargo tree --workspace --all-features -i libsqlite3-sys || true

      - name: Generate the SQLite rows of this operating system
        shell: bash
        run: |
          mkdir -p generated
          cargo run -q -p persistant-sqlx --features sqlite --example matrix_sqlite > generated/sqlx-sqlite.tsv

      - name: Upload what was generated
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-lock-sqlx-sqlite-${{ runner.os }}
          path: generated/sqlx-sqlite.tsv

      # The loud part: with the fresh lock, the registry must open sqlite and sqlite-full for the
      # key-value needs. It fails when no recorded row names the newest bundled SQLite.
      - name: open_named still opens on the fresh lock
        run: cargo test -p persistant --features registry-sqlite --test registry --test registry_listed_opens --no-fail-fast

      - name: The checked-in rows name the SQLite this lock builds
        shell: bash
        run: |
          ver=$(awk -F'\t' 'NR==2{print $4}' generated/sqlx-sqlite.tsv)
          echo "built: $ver"
          grep -qF "$ver" matrix/sqlx-sqlite.tsv || { echo "::error::no row in matrix/sqlx-sqlite.tsv for $ver"; exit 1; }

  report:
    name: Collect new rows, open or update an issue
    needs: certify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A fresh lock runs build scripts of whatever `cargo update` resolved; they must not find
          # the checkout token in .git/config.
          persist-credentials: false

      - name: Collect the rows of the three operating systems that are not recorded yet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fresh out
          : > out/new-rows.tsv
          : > out/missing.txt
          for os in Linux Windows macOS; do
            # A failed download is not "no new rows": it is written down and fails this job below.
            gh run download "${{ github.run_id }}" -n "fresh-lock-sqlx-sqlite-$os" -D "fresh/$os" || echo "$os" >> out/missing.txt
            f="fresh/$os/sqlx-sqlite.tsv"
            [ -f "$f" ] || continue
            tail -n +2 "$f" | grep -vxFf matrix/sqlx-sqlite.tsv >> out/new-rows.tsv || true
          done
          echo "new rows: $(wc -l < out/new-rows.tsv); no artifact for: $(tr '\n' ' ' < out/missing.txt)"

      - name: Upload the new rows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-lock-new-rows
          path: out/new-rows.tsv

      - name: Open or update the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFY: ${{ needs.certify.result }}
        run: |
          n=$(wc -l < out/new-rows.tsv)
          missing=$(tr '\n' ' ' < out/missing.txt)
          title="Fresh lock: SQLite rows to record"
          # `// empty`: with no match `.[0].number` is JSON null, which jq prints as the text "null".
          num=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ "$n" -eq 0 ] && [ "$CERTIFY" = success ] && [ -z "$missing" ]; then
            echo "nothing to record"
            # The rows are recorded and every job passed: the issue says so and closes.
            if [ -n "$num" ]; then gh issue close "$num" --comment "Run ${{ github.run_id }}: certify passed on all three operating systems and every row is recorded. — lane: persistant"; fi
            exit 0
          fi
          body="Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}: certify=$CERTIFY, $n new rows (artifact fresh-lock-new-rows), no artifact downloaded for: ${missing:-none}. Append them to matrix/sqlx-sqlite.tsv on a branch, update the per-version counts in tests/checked_in_matrix_sqlite.rs, add a changelog fragment, open a pull request. Until then a consumer on a fresh lockfile is refused at open_named. — lane: persistant"
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          # An artifact that could not be downloaded is a failure of this job, not a quiet "no rows".
          [ -z "$missing" ] || { echo "::error::no artifact downloaded for: $missing"; exit 1; }
