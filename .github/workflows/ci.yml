name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test, clippy, fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      # The opt-in re-exports of the facade (needs the 1.94 compiler this job installs).
      - name: cargo test persistant --all-features
        run: cargo test -p persistant --all-features --no-fail-fast

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Read the floor from the manifest so the job cannot drift from it.
      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo check on the MSRV toolchain
        run: |
          rustc --version
          cargo check --workspace --exclude persistant-sqlx --all-targets

  msrv-sqlx:
    name: MSRV persistant-sqlx (its own rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # sqlx 0.9 needs a newer compiler than the rest of the workspace; only this crate pays it.
      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' crates/persistant-sqlx/Cargo.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo check on the persistant-sqlx floor
        run: |
          rustc --version
          cargo check -p persistant-sqlx --all-targets

  relational:
    name: Relational (PostgreSQL 16 service container)
    runs-on: ubuntu-latest
    # SUP-008 waiver reason (PM ruling 2026-10-14, service-container images): CI-only container, no
    # credential of ours reaches it, it is reachable only from this job's runner. Pinned by digest
    # anyway, so the waiver is only about the refresh routine: bump the digest by hand when the
    # server major or a security patch matters. The role is the image's superuser because the tests
    # create and drop their own tables; least privilege here means nothing else is shared with it.
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_PASSWORD: persistant-test
          POSTGRES_DB: persistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PERSISTANT_TEST_DATABASE_URL: postgres://postgres:persistant-test@localhost:5432/persistant
      # A missing URL must fail here, not skip: a skipped test must not look green.
      PERSISTANT_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # A second server, with TLS on, from the same pinned image (private CA + a leaf for
      # localhost, made inside the container). SUP-008 waiver reason as above: CI-only, no
      # credential of ours reaches it.
      - name: Start a PostgreSQL with TLS
        run: bash .github/scripts/postgres-tls.sh pg-tls 5433 "${{ runner.temp }}/pg-tls-ca.pem"

      - name: cargo test persistant-sqlx (real PostgreSQL, plain and TLS)
        env:
          PERSISTANT_TEST_TLS_DATABASE_URL: postgres://postgres:persistant-test@localhost:5433/persistant
          PERSISTANT_TEST_TLS_CA: ${{ runner.temp }}/pg-tls-ca.pem
          PERSISTANT_REQUIRE_TLS_DATABASE: "1"
        run: cargo test -p persistant-sqlx --no-fail-fast

      - name: Regenerate matrix/sqlx-postgres.tsv
        run: |
          mkdir -p generated
          cargo run -q -p persistant-sqlx --example matrix > generated/sqlx-postgres.tsv

      - name: Upload what was generated
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-sqlx-postgres
          path: generated/sqlx-postgres.tsv

      - name: Compare with the checked-in file
        run: diff -u matrix/sqlx-postgres.tsv generated/sqlx-postgres.tsv

  sqlite:
    name: SQLite (bundled library, no server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: cargo test persistant-sqlx --features sqlite
        run: cargo test -p persistant-sqlx --features sqlite --no-fail-fast

      - name: Regenerate matrix/sqlx-sqlite.tsv
        run: |
          mkdir -p generated
          cargo run -q -p persistant-sqlx --features sqlite --example matrix_sqlite > generated/sqlx-sqlite.tsv

      - name: Upload what was generated
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-sqlx-sqlite
          path: generated/sqlx-sqlite.tsv

      - name: Compare with the checked-in file
        run: diff -u matrix/sqlx-sqlite.tsv generated/sqlx-sqlite.tsv

      # Stage 3 (speed) is data, not a gate: it is recorded with this runner's environment and the
      # command that re-runs it, uploaded, and printed. Nothing compares it to a constant.
      - name: Time the key-value workloads on SQLite
        run: |
          cargo run -q --release -p persistant-sqlx --features sqlite --example speed > generated/sqlx-speed.tsv
          cargo run -q -p persistant-kv --example speed_report -- generated/sqlx-speed.tsv

      - name: Upload the speed data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-sqlx-sqlite
          path: generated/sqlx-speed.tsv

  mysql:
    name: MySQL 8.4 (service container)
    runs-on: ubuntu-latest
    # SUP-008 waiver reason (PM ruling 2026-10-14, service-container images), as for PostgreSQL above:
    # CI-only container, no credential of ours reaches it, reachable only from this job's runner.
    # Pinned by digest. Digest read from the registry on 2026-10-16:
    #   docker buildx imagetools inspect mysql:8.4   (index digest of the 8.4 tag)
    services:
      mysql:
        image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ROOT_PASSWORD: persistant-test
          MYSQL_DATABASE: persistant
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppersistant-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PERSISTANT_TEST_MYSQL_URL: mysql://root:persistant-test@127.0.0.1:3306/persistant
      # A missing URL must fail here, not skip.
      PERSISTANT_REQUIRE_MYSQL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: cargo test persistant-sqlx --features mysql
        run: cargo test -p persistant-sqlx --features mysql --test kv_on_mysql --test checked_in_matrix_mysql --test durability_mysql --no-fail-fast

      - name: Regenerate matrix/sqlx-mysql.tsv
        run: |
          mkdir -p generated
          cargo run -q -p persistant-sqlx --features mysql --example matrix_mysql > generated/sqlx-mysql.tsv

      - name: Upload what was generated
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-sqlx-mysql
          path: generated/sqlx-mysql.tsv

      - name: Compare with the checked-in file
        run: diff -u matrix/sqlx-mysql.tsv generated/sqlx-mysql.tsv

  matrix-blob-kv:
    name: Matrix is what the code certifies (blob + KvOnBlob)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Regenerate matrix/opendal.tsv
        run: |
          mkdir -p generated
          cargo run -q -p persistant-opendal --example matrix > generated/opendal.tsv

      - name: Upload what was generated
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-opendal
          path: generated/opendal.tsv

      # The checked-in file is a record of what this code certified on Linux. A backend or crate
      # version bump changes it, and that change belongs in the same review.
      - name: Compare with the checked-in file
        run: diff -u matrix/opendal.tsv generated/opendal.tsv

      # Stage 3 (speed): data with its environment, not a gate. See the SQLite job.
      - name: Time the key-value workloads
        run: |
          cargo run -q --release -p persistant-opendal --example speed > generated/opendal-speed.tsv
          cargo run -q -p persistant-kv --example speed_report -- generated/opendal-speed.tsv

      - name: Upload the speed data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-opendal
          path: generated/opendal-speed.tsv

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  spdx:
    name: Every source file declares the licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Self-test the gate (it must be able to fail)
        run: bash .github/spdx_gate.sh --self-test
      - name: Every tracked source file declares the licence
        run: bash .github/spdx_gate.sh
