# SPDX-License-Identifier: MIT OR Apache-2.0
# The Machine durability test (kv.durability.machine): power-cut a Hyper-V guest after acknowledged
# writes and check that nothing acknowledged was lost. It cannot run on a GitHub-hosted runner (no
# nested Hyper-V), so it runs on the self-hosted runner under the conditions of
# CIRESNAVE-EXPECTATIONS 5.1g/5.1h: push to main, schedule and manual dispatch only (no
# pull_request trigger, so no PR code reaches the runner), no secrets, never #[ignore]d.
#
# The runner account (gh-runner) needs: membership of "Hyper-V Administrators", and the guest image
# from scripts/machine-durability/build-image.ps1 in C:\ProgramData\persistant-machine-durability
# (read access). The Linux binary is built here, on a hosted runner, because gh-runner has no
# toolchain and no Docker; the guest is Ubuntu 24.04, so the binary is built on the same.
name: machine-durability

on:
  push:
    branches: [main]
    paths:
      - 'scripts/machine-durability/**'
      - 'crates/persistant-sqlx/examples/machine_vm.rs'
      - 'crates/persistant-kv/src/**'
      - '.github/workflows/machine-durability.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-binary:
    name: Build the guest binary (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo build --release -p persistant-sqlx --example machine_vm --features sqlite,mysql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: machine_vm
          path: target/release/examples/machine_vm
          if-no-files-found: error

  power-loss:
    name: Power loss (Hyper-V guest, self-hosted)
    needs: guest-binary
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: machine_vm
          path: guest
      - name: Power-cut the guest, boot it, check every acknowledged key
        shell: powershell
        run: >
          ./scripts/machine-durability/run.ps1
          -Binary "$PWD\guest\machine_vm"
          -WorkDir "$env:RUNNER_TEMP\machine-durability"
          -ResultFile "$env:RUNNER_TEMP\machine-durability-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: machine-durability-result
          path: ${{ runner.temp }}/machine-durability-result.json
          if-no-files-found: warn
