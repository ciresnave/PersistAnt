# cargo-deny configuration. Read the job log: an advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # chrono 0.4.45 via persistant-relational (feature `chrono`) and sqlx-core 0.9.0. Dated ignore, expires 2026-12-17 (PM ruling 2026-11-17):
    # Renewed 2026-11-22 (pm-ants): moving persistant-relational off chrono alone does not clear this, because persistant-sqlx keeps sqlx's `chrono` feature for Humboldt's query! sites (tests/sqlx_features.rs). Remove when ROADMAP row 42 is done together with that consumer change, or renew again with a reason.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice, no known vulnerability; reached through persistant-relational and sqlx-core 0.9.0; no safe upgrade; chrono stays through sqlx's `chrono` feature that persistant-sqlx enables for chrono consumers, so a move off chrono in persistant-relational alone does not clear it; expires 2026-12-17" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # webpki-roots (Mozilla's CA bundle as data), pulled by sqlx's `tls-rustls-ring-webpki`; a
    # permissive data licence. Allowed here at 0.4.28; the PM may prefer `native-roots` instead.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
