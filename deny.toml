# cargo-deny configuration. Read the job log: an advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # libsqlite3-sys 0.37 via sqlx-sqlite 0.9. Dated ignore, expires 2026-12-09 (PM 2026-11-09): remove when
    # sqlx releases the fix (transact-rs/sqlx#4502, merged, unreleased) and persistant-sqlx is bumped.
    { id = "RUSTSEC-2026-0459", reason = "awaiting sqlx#4502 release; expires 2026-12-09" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # webpki-roots (Mozilla's CA bundle as data), pulled by sqlx's `tls-rustls-ring-webpki`; a
    # permissive data licence. Allowed here at 0.4.28; the PM may prefer `native-roots` instead.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
