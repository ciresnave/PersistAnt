[package]
name = "persistant-sqlx"
version.workspace = true
edition = "2024"
# sqlx 0.9 needs 1.94; only this crate (and what depends on it) pays it. The workspace MSRV job
# excludes it and a separate job checks it on its own floor.
rust-version = "1.94"
description = "PersistAnt's relational driver over sqlx: implements RelationalBackend for PostgreSQL, with typed error classification."
license = "MIT OR Apache-2.0"
exclude = [".coderipper.toml"]
repository = "https://github.com/ciresnave/PersistAnt"
keywords = ["sql", "postgres", "sqlx", "persistence"]
categories = ["database"]

[features]
# SQLite is compiled in (bundled C library): opt in.
sqlite = ["sqlx/sqlite"]
# MySQL and MariaDB (pure Rust driver).
mysql = ["sqlx/mysql"]
# `OnPool` and `OnConn`: run `persistant::sqlx_query!` statements on an sqlx pool or connection (docs/DESIGN-SQLX-BRIDGE.md section 6).
bridge = ["persistant-relational/sql"]

[dependencies]
persistant-core = { workspace = true }
persistant-relational = { workspace = true, features = ["catalog"] }
tokio = { version = "1.53.2", default-features = false, features = ["sync", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "time"] }

# Owner-only files on Windows (src/owner_only.rs): the Win32 security API.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
sha2 = "0.11"
persistant-kv = { workspace = true }
# `persistant::sql!` end to end: the macro, and the `sql` feature of persistant-relational for its traits.
persistant-macros = { workspace = true }
persistant-relational = { workspace = true, features = ["sql", "uuid", "chrono", "json"] }
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }

[[example]]
name = "matrix_sqlite"
required-features = ["sqlite"]

[[example]]
name = "matrix_mysql"
required-features = ["mysql"]

[[example]]
name = "sqlx_speed"
required-features = ["sqlite"]

[[example]]
name = "rel_speed"
required-features = ["sqlite"]

[[example]]
name = "machine_vm"
required-features = ["sqlite", "mysql"]

[[test]]
name = "sqlite_file_mode"
required-features = ["sqlite"]

[[test]]
name = "sqlite_file_acl"
required-features = ["sqlite"]

[[test]]
name = "sqlite_open_path"
required-features = ["sqlite"]

[[test]]
name = "durability_sqlite"
harness = false
required-features = ["sqlite"]

[[test]]
name = "durability_postgres"
harness = false

[[test]]
name = "durability_mysql"
harness = false
required-features = ["mysql"]

[[test]]
name = "sqlx_bridge"
required-features = ["bridge"]

[[test]]
name = "tls_mysql"
required-features = ["mysql"]
