[package]
name = "persistant-relational"
version.workspace = true
edition = "2024"
rust-version = "1.94"
description = "PersistAnt's relational kind: a small RelationalBackend trait (statement with parameters, transaction, dialect), portable values and typed error classification. No driver."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/PersistAnt"
keywords = ["sql", "database", "persistence", "capabilities"]
categories = ["database-implementations"]

[features]
# `persistant::sql!` support: the `Sql` value the macro expands to, and `execute_sql` / `query_sql`.
sql = ["dep:unisql-embed"]
# A schema snapshot: read a database's catalog and write it as deterministic JSON.
catalog = ["dep:unisql-core"]
# `FromValue` / `ToValue` for the types a driver carries as canonical text (needs `sql`).
uuid = ["sql", "dep:uuid"]
chrono = ["sql", "dep:chrono"]
json = ["sql", "dep:serde_json"]

[dependencies]
persistant-core = { workspace = true }
# Published version only (portfolio rule 2026-10-07). No dependencies of its own, `no_std`.
unisql-embed = { version = "0.27.0", optional = true }
unisql-core = { version = "0.27.0", features = ["serde"], optional = true }
uuid = { version = "1", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
serde_json = { version = "1", optional = true }
