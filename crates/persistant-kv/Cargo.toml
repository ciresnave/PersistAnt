[package]
name = "persistant-kv"
version.workspace = true
edition = "2024"
rust-version = "1.94"
description = "PersistAnt's key-value kind: the KvBackend trait, KvOnBlob over any BlobBackend, a memory reference backend, and the contract tests that turn kv capabilities on. No driver."
license = "MIT OR Apache-2.0"
exclude = [".coderipper.toml"]
repository = "https://github.com/ciresnave/PersistAnt"
keywords = ["storage", "persistence", "key-value", "conformance"]
categories = ["database-implementations", "development-tools::testing"]

[dependencies]
persistant-core = { workspace = true }
persistant-blob = { workspace = true }
persistant-relational = { workspace = true }
# Pure translation, no I/O. Published version only (CireSnave rule 2026-10-07).
unisql = "0.27.10"
# The concurrent speed harness spawns tasks and gates them on a barrier.
tokio = { version = "1.53.2", features = ["rt", "sync"] }
# `Traced`, behind the `tracing` feature.
tracing = { version = "0.1.44", optional = true }
# `text-index-tokenizer` (crates.io newest at writing: 1.13.3 and 0.1.26).
unicode-segmentation = { version = "1.13.3", optional = true }
unicode-normalization = { version = "0.1.26", optional = true }

[features]
tracing = ["dep:tracing"]
# `text::TextIndex`: a text index over any kv backend with `batch` and `ordered_scan_values`. No new dependency.
text-index = []
# `text_tokenizer::tokenize`: Unicode word boundaries (UAX #29) after NFKC normalisation, lower-cased. Pulls
# `unicode-segmentation` (MSRV 1.85.0) and `unicode-normalization` (MSRV 1.36); both are below this crate's 1.94.
text-index-tokenizer = ["text-index", "dep:unicode-segmentation", "dep:unicode-normalization"]

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
