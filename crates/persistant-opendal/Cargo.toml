[package]
name = "persistant-opendal"
version.workspace = true
edition = "2024"
rust-version = "1.94"
description = "PersistAnt's blob driver over Apache OpenDAL: implements BlobBackend for the fs and memory services."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/PersistAnt"
keywords = ["storage", "persistence", "opendal", "blob"]
categories = ["filesystem"]

[features]
# Test-only: a pause inside `finish`, for the kill-during-finish crash test. Never enable in a product.
failpoint = []

[dependencies]
persistant-core = { workspace = true }
persistant-blob = { workspace = true }
opendal = { version = "0.59.4", default-features = false, features = ["services-fs"] }
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.53.2", features = ["rt", "fs"] }

[dev-dependencies]
persistant-opendal = { path = ".", features = ["failpoint"] }
persistant-kv = { workspace = true }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "sync"] }

[[test]]
name = "durability_fs"
harness = false
